[project]
name = "zecpy-demo"
version = "0.1.0"
description = "Live demo of ZecPy against a local regtest chain, with every light-server request shown as it happens"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
